name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      # 读取 RELEASE_NOTES.md 作为 Release 说明（发布前在本地维护好该文件）。
      # 文件不存在或为空时，说明留空，不会中断构建。
      - name: Read release notes
        id: notes
        shell: bash
        run: |
          if [ -s RELEASE_NOTES.md ]; then
            {
              echo 'body<<RELEASE_NOTES_EOF'
              cat RELEASE_NOTES.md
              echo 'RELEASE_NOTES_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "body=" >> "$GITHUB_OUTPUT"
          fi

      # 版本号统一以 src-tauri/Cargo.toml 的 [package].version 为唯一来源
      # （tauri.conf.json 不写 version，构建时自动回退读 Cargo.toml）。
      # tauri-action 的 __VERSION__ 占位依赖 conf，这里改为显式提取版本，
      # 生成 tag / Release 名，避免与 Cargo.toml 产生歧义。
      - name: Resolve app version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' src-tauri/Cargo.toml | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "::error::version not found in src-tauri/Cargo.toml"
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      # 构建 Tauri 应用（前端由 beforeBuildCommand 自动构建到 src-react/dist），
      # 并自动创建 GitHub Release，上传 NSIS 安装包。
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: 'IC Tarkov ${{ steps.version.outputs.tag }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          # 使用 RELEASE_NOTES.md 作为说明，不再由 GitHub 生成 commit 列表
          generateReleaseNotes: false
          uploadWorkflowArtifacts: true

  # Android APK（仅 arm64）。needs 串行：Release 由 build-windows 的 tauri-action 创建，
  # 本 job 只追加 APK 资产（gh release upload --clobber），避免竞争创建。
  # 签名：复用本地 debug.keystore（base64 存于 Secret ANDROID_KEYSTORE_BASE64），
  # 与本地 android-release.bat 使用同一把密钥，保证本地与 CI 构建的 APK 签名一致、可互相覆盖更新。
  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      # GitHub runner 预装 Android SDK 与 NDK，但 NDK_HOME 未显式设置，这里解析出来
      - name: Resolve Android NDK
        shell: bash
        run: echo "NDK_HOME=$(ls -d "$ANDROID_HOME"/ndk/* | head -n 1)" >> "$GITHUB_ENV"

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' src-tauri/Cargo.toml | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "::error::version not found in src-tauri/Cargo.toml"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      # 将 Secret 里的 keystore（base64）解码为本地文件，供 sign-apk.mjs 签名。
      # 密钥库口令/别名与本地 debug.keystore 一致（android / androiddebugkey）。
      - name: Decode signing keystore
        shell: bash
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build and sign Android APK (arm64)
        env:
          ANDROID_KEYSTORE_PATH: keystore.jks
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: androiddebugkey
        run: npm run tauri:android

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp apks/IC-Tarkov-arm64.apk "IC-Tarkov_v${{ steps.version.outputs.version }}_android_arm64.apk"
          gh release upload "${{ steps.version.outputs.tag }}" "IC-Tarkov_v${{ steps.version.outputs.version }}_android_arm64.apk" --clobber
