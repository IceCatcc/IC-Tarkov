[package]
name = "eft-spy"
version = "0.1.2"
description = "EFT log task monitor"
edition = "2021"
rust-version = "1.70"

[lib]
name = "eft_spy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
notify = "6"
once_cell = "1"
chrono = "0.4"

# rustc 1.98 在 Windows 上增量编译会触发 ICE（metadata encoder panic），禁用之
[profile.dev]
incremental = false
