[package]
name = "ic-tarkov"
version = "0.1.9"
description = "IC Tarkov log task monitor"
edition = "2021"
rust-version = "1.70"

[lib]
name = "ic_tarkov_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 拉取 tarkov.dev 原始 API JSON。启用 `tls` feature（ureq 2.x 的 rustls 纯 Rust 后端，移动端必须，native-tls 不可用）；桌面端普通用户无影响
ureq = { version = "2", default-features = false, features = ["tls"] }
regex = "1"
notify = "6"
once_cell = "1"
chrono = "0.4"
# 局域网同步（电脑端本地 WS/HTTP 服务）：axum + tokio + 广播通道；if_addrs 枚举网卡 IP；rand 生成配对 token
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
futures-util = "0.3"
if-addrs = "0.13"
rand = "0.8"

# rustc 1.98 在 Windows 上增量编译会触发 ICE（metadata encoder panic），禁用之
[profile.dev]
incremental = false

# 发布构建：裁剪符号 + LTO，缩小体积并降低杀软（360 等）对未签名 exe 的启发式误报面。
# 分发给他人时务必用 release 构建，不要用 target/debug 下的 exe。
[profile.release]
strip = true
lto = true
codegen-units = 1
