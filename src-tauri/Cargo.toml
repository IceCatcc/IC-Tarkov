[package]
name = "eft-spy"
version = "0.1.4"
description = "EFT log task monitor"
edition = "2021"
rust-version = "1.70"

[lib]
name = "eft_spy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 拉取 tarkov.dev 原始 API JSON（Windows 走 schannel，无需额外 TLS 依赖）
ureq = { version = "2", default-features = false, features = ["native-tls"] }
regex = "1"
notify = "6"
once_cell = "1"
chrono = "0.4"

# rustc 1.98 在 Windows 上增量编译会触发 ICE（metadata encoder panic），禁用之
[profile.dev]
incremental = false

# 发布构建：裁剪符号 + LTO，缩小体积并降低杀软（360 等）对未签名 exe 的启发式误报面。
# 分发给他人时务必用 release 构建，不要用 target/debug 下的 exe。
[profile.release]
strip = true
lto = true
codegen-units = 1
